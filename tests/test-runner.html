<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>TPA Pro — Tests</title>
  <link rel="stylesheet" href="../css/modals-1.css">
</head>
<body>
  <h1>TPA Pro Test Runner</h1>
  <pre id="out"></pre>
  <script src="../js/translate-dom.js"></script>
  <script src="../js/i18n-core.js"></script>
  <script src="../js/lang.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/utils-2.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/data-seed.js"></script>
  <script src="../js/data-models.js"></script>
  <script src="../js/data-claims.js"></script>
  <script src="../js/entities.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/engine-fields.js"></script>
  <script src="../js/engine-fields-2.js"></script>
  <script src="../js/engine-rules.js"></script>
  <script src="../js/engine-validate.js"></script>
  <script src="../js/compute-patient.js"></script>
  <script type="module">
    try {
      const res = await fetch('../TPA_Pro_TestData.json');
      if (res.ok) {
        const p = await res.json();
        const d = p.data || {};
        if (Array.isArray(d.providers)) window.providers = providers = d.providers;
        if (Array.isArray(d.contracts)) window.contracts = contracts = d.contracts;
        if (Array.isArray(d.tariffs)) window.tariffs = tariffs = d.tariffs;
        if (Array.isArray(d.batches)) window.batches = batches = d.batches;
        if (Array.isArray(d.claims)) window.claims = claims = d.claims;
        if (Array.isArray(d.trash)) window.trash = trash = d.trash;
        if (Array.isArray(d.deductionRules)) window.deductionRules = deductionRules = d.deductionRules;
        if (Array.isArray(d.paProcedures)) window.paProcedures = paProcedures = d.paProcedures;
        claims.forEach(c => { if(!c.type) c.type='employee'; if(!c.invoices) c.invoices=[]; if(!c.priorApproval) c.priorApproval={required:false,status:'not-requested',refNumber:'',date:''}; recalcClaim(c); });
      }
    } catch (e) { console.warn('seed load skipped', e && e.message); }
    const s = document.createElement('script');
    s.src = '../tests/tests.js';
    document.head.appendChild(s);
  </script>
</body>
</html>
